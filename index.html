<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#667eea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="记账">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
  <title>记账 App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      max-width: 500px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      padding-bottom: 70px;
    }

    .header {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      text-align: center;
      padding: 25px 20px;
    }
    .header h1 { font-size: 22px; }
    .header .date { font-size: 13px; margin-top: 6px; }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    /* ===== 页面容器（硬切换）===== */
    .page {
      display: none;
    }
    .page.active {
      display: block;
    }

    /* ===== 底部导航 ===== */
    .nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 500px;
      background: white;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
    }
    .nav .tab {
      text-align: center;
      font-size: 11px;
      color: #999;
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 8px;
    }
    .nav .tab .icon { font-size: 22px; display: block; }
    .nav .tab.active { color: #667eea; font-weight: bold; }

    /* ===== 首页统计卡片 ===== */
    .stats-row {
      display: flex;
      gap: 10px;
      margin: 16px;
    }
    .stat-card {
      flex: 1;
      background: white;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .stat-card .num {
      font-size: 24px;
      font-weight: bold;
      color: #e74c3c;
    }
    .stat-card .label {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }

    .empty { text-align: center; color: #bbb; padding: 30px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>💰 记账 App</h1>
    <div class="date" id="headerDate">2026年5月</div>
  </div>

  <!-- 第1页：首页 -->
  <div class="page" id="page-home">
    <div class="stats-row">
      <div class="stat-card">
        <div class="num" id="monthTotal">¥ 0</div>
        <div class="label">本月支出</div>
      </div>
      <div class="stat-card">
        <div class="num" id="todayTotal">¥ 0</div>
        <div class="label">今日支出</div>
      </div>
    </div>
    <div class="card">
      <div style="font-weight: bold; margin-bottom: 12px; color: #333;">📌 最近记录</div>
      <div id="recentList">
        <div class="empty">还没有记录</div>
      </div>
    </div>
  </div>

  <!-- 第2页：记账 -->
  <div class="page" id="page-add">
    <div class="card">
      <div style="font-weight: bold; margin-bottom: 12px; color: #333;">✏️ 记一笔</div>
      <div style="display:flex; gap:10px; margin-bottom:12px;">
        <select id="categoryInput" style="flex:1; padding:12px; border:2px solid #e0e0e0; border-radius:8px; font-size:16px;">
          <option value="🍚 餐饮">🍚 餐饮</option>
          <option value="🚗 交通">🚗 交通</option>
          <option value="🛒 购物">🛒 购物</option>
          <option value="☕ 饮品">☕ 饮品</option>
          <option value="🎬 娱乐">🎬 娱乐</option>
          <option value="💸 其他">💸 其他</option>
        </select>
        <input type="number" id="amountInput" placeholder="金额" min="0.01" step="0.01"
          style="flex:1; padding:12px; border:2px solid #e0e0e0; border-radius:8px; font-size:16px;">
      </div>
      <div style="margin-bottom:12px;">
        <input type="text" id="descInput" placeholder="具体描述（如：买衣服）"
          style="width:100%; padding:12px; border:2px solid #e0e0e0; border-radius:8px; font-size:16px;">
      </div>
      <button onclick="addRecord()"
        style="width:100%; padding:14px; background:linear-gradient(135deg,#667eea,#764ba2); color:white; border:none; border-radius:8px; font-size:18px; cursor:pointer;">
        ➕ 添加记录
      </button>
    </div>
  </div>

  <!-- 第3页：账单 -->
  <div class="page" id="page-list">
    <div class="card">
      <div style="font-weight: bold; margin-bottom: 12px; color: #333;">📋 全部账单</div>
      <div id="allRecords">
        <div class="empty">还没有记录</div>
      </div>
    </div>
  </div>

  <!-- 第4页：统计 -->
  <div class="page" id="page-stats">
    <div class="card">
      <div style="font-weight: bold; margin-bottom: 12px; color: #333;">📊 分类统计</div>
      <div id="statsContent">
        <div class="empty">还没有数据</div>
      </div>
    </div>
  </div>

  <!-- 底部导航栏 -->
  <div class="nav">
    <div class="tab" onclick="switchPage('home')">
      <span class="icon">🏠</span>首页
    </div>
    <div class="tab" onclick="switchPage('add')">
      <span class="icon">✏️</span>记账
    </div>
    <div class="tab" onclick="switchPage('list')">
      <span class="icon">📋</span>账单
    </div>
    <div class="tab" onclick="switchPage('stats')">
      <span class="icon">📊</span>统计
    </div>
  </div>

  <script>
    // ===== 数据层：通过 HTTP API 和服务器通信 =====
    var records = [];

    var saved = localStorage.getItem('records2');
    if (saved) records = JSON.parse(saved);

    function save() {
      localStorage.setItem('records2', JSON.stringify(records));
    }

    function todayStr() {
      var d = new Date();
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }

    function pad(n) {
      return n < 10 ? '0' + n : '' + n;
    }

    // ===== 创建（Create）=====
    function addRecord() {
      var category = document.getElementById('categoryInput').value;
      var amountText = document.getElementById('amountInput').value;
      var desc = document.getElementById('descInput').value;

      if (!amountText) { alert('请输入金额'); return; }
      var amount = parseFloat(amountText);
      if (amount <= 0) { alert('金额必须大于 0'); return; }

      var parts = category.split(' ');
      var now = new Date();
      var time = pad(now.getHours()) + ':' + pad(now.getMinutes());

      records.push({
        id: Date.now(),
        icon: parts[0],
        note: desc || parts[1],
        amount: amount,
        time: time,
        dateStr: todayStr()
      });

      save();
      document.getElementById('amountInput').value = '';
      document.getElementById('descInput').value = '';
      refreshAll();
      switchPage('home');
    }

    // ===== 删除（Delete）=====
    function deleteRecord(id) {
      for (var i = 0; i < records.length; i++) {
        if (records[i].id === id) {
          records.splice(i, 1);
          break;
        }
      }
      save();
      refreshAll();
    }

    // ===== 更新（Update）=====
    function editRecord(id) {
      for (var i = 0; i < records.length; i++) {
        if (records[i].id === id) {
          var r = records[i];
          var newNote = prompt('修改描述', r.note);
          if (newNote === null) return;
          var newAmount = parseFloat(prompt('修改金额', r.amount));
          if (isNaN(newAmount) || newAmount <= 0) { alert('金额无效'); return; }
          r.note = newNote;
          r.amount = newAmount;
          save();
          refreshAll();
          return;
        }
      }
    }

    // ===== 读取 & 渲染（Read）=====
    function refreshAll() {
      renderHome();
      renderAllRecords();
      renderStats();
    }

    function monthTotal() {
      var currentMonth = todayStr().slice(0, 7);
      var sum = 0;
      for (var i = 0; i < records.length; i++) {
        if (records[i].dateStr.slice(0, 7) === currentMonth) sum += records[i].amount;
      }
      return sum;
    }

    function todayTotal() {
      var t = todayStr();
      var sum = 0;
      for (var i = 0; i < records.length; i++) {
        if (records[i].dateStr === t) sum += records[i].amount;
      }
      return sum;
    }

    // 首页
    function renderHome() {
      document.getElementById('monthTotal').textContent = '¥ ' + monthTotal().toFixed(2);
      document.getElementById('todayTotal').textContent = '¥ ' + todayTotal().toFixed(2);

      var recent = records.slice().reverse().slice(0, 5);
      var html = '';
      if (recent.length === 0) {
        html = '<div class="empty">还没有记录</div>';
      } else {
        for (var i = 0; i < recent.length; i++) {
          var r = recent[i];
          html += rowHTML(r);
        }
      }
      document.getElementById('recentList').innerHTML = html;
    }

    // 全部账单
    function renderAllRecords() {
      var sorted = records.slice().sort(function(a, b) { return b.id - a.id; });
      if (sorted.length === 0) {
        document.getElementById('allRecords').innerHTML = '<div class="empty">还没有记录</div>';
        return;
      }

      var html = '';
      var lastDate = '';
      for (var i = 0; i < sorted.length; i++) {
        var r = sorted[i];
        if (r.dateStr !== lastDate) {
          lastDate = r.dateStr;
          html += '<div style="color:#888; font-size:13px; margin:12px 0 6px; padding-top:8px; border-top:1px solid #f0f0f0;">'
            + r.dateStr + '</div>';
          if (i === 0) html = html.replace('border-top:1px solid #f0f0f0;', '');
        }
        html += rowHTML(r);
      }
      document.getElementById('allRecords').innerHTML = html;
    }

    // 统计
    function renderStats() {
      if (records.length === 0) {
        document.getElementById('statsContent').innerHTML = '<div class="empty">还没有数据</div>';
        return;
      }

      var categories = {};
      var totalAll = 0;
      for (var i = 0; i < records.length; i++) {
        var r = records[i];
        var key = r.icon + ' ' + r.note;
        if (!categories[key]) categories[key] = 0;
        categories[key] += r.amount;
        totalAll += r.amount;
      }

      var html = '';
      var keys = Object.keys(categories);
      for (var i = 0; i < keys.length; i++) {
        var amt = categories[keys[i]];
        var pct = Math.round(amt / totalAll * 100);
        html += '<div style="margin-bottom:14px;">'
          + '<div style="display:flex; justify-content:space-between; margin-bottom:4px;">'
          + '<span>' + keys[i] + '</span>'
          + '<span style="color:#e74c3c; font-weight:bold;">¥ ' + amt.toFixed(2) + ' (' + pct + '%)</span>'
          + '</div>'
          + '<div style="background:#eee; border-radius:4px; height:8px;">'
          + '<div style="background:linear-gradient(90deg,#667eea,#764ba2); border-radius:4px; height:8px; width:' + pct + '%;"></div>'
          + '</div>'
          + '</div>';
      }
      document.getElementById('statsContent').innerHTML = html;
    }

    function rowHTML(r) {
      return '<div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #f5f5f5;">'
        + '<div style="display:flex; align-items:center;">'
        + '<span style="font-size:22px; margin-right:8px;">' + r.icon + '</span>'
        + '<div>'
        + '<div style="color:#555;">' + r.note + '</div>'
        + '<div style="color:#aaa; font-size:12px;">' + r.dateStr + ' ' + r.time + '</div>'
        + '</div>'
        + '</div>'
        + '<span style="color:#e74c3c; font-weight:bold;">-¥ ' + r.amount.toFixed(2) + '</span>'
        + '<span onclick="editRecord(' + r.id + ')" style="color:#667eea; margin-left:8px; cursor:pointer; font-size:13px;">编辑</span>'
        + '<span onclick="deleteRecord(' + r.id + ')" style="color:#e74c3c; margin-left:4px; cursor:pointer; font-size:18px;">×</span>'
        + '</div>';
    }

    // ===== 页面切换 =====
    function switchPage(name) {
      // 隐藏所有页面
      var pages = document.getElementsByClassName('page');
      for (var i = 0; i < pages.length; i++) {
        pages[i].classList.remove('active');
      }
      // 取消所有导航高亮
      var tabs = document.getElementsByClassName('tab');
      for (var i = 0; i < tabs.length; i++) {
        tabs[i].classList.remove('active');
      }
      // 显示目标页面 + 高亮对应导航
      document.getElementById('page-' + name).classList.add('active');
      var allTabs = document.querySelectorAll('.nav .tab');
      var tabTexts = { home: '首页', add: '记账', list: '账单', stats: '统计' };
      for (var i = 0; i < allTabs.length; i++) {
        if (allTabs[i].textContent.indexOf(tabTexts[name]) !== -1) {
          allTabs[i].classList.add('active');
        }
      }
      // 记住当前页面（刷新后恢复）
      localStorage.setItem('currentPage', name);
    }

    // 初始化：恢复上次页面
    // 注册 Service Worker（离线缓存）
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(function() { console.log('SW 已注册'); });
    }

    var lastPage = localStorage.getItem('currentPage') || 'home';
    switchPage(lastPage);
    refreshAll();
  </script>
</body>
</html>
